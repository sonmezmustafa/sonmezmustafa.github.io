title: Mustafa Sönmez
url: "https://sonmezmustafa.com"
baseurl: ""
markdown: kramdown
timezone: Europe/Istanbul

email: cemustafasonmez@gmail.com
person_image: /assets/img/mustafa-sonmez.jpg

# Kişi şemasındaki "sameAs": aynı kişiye ait diğer profiller
same_as:
  - https://www.linkedin.com/in/cemustafasonmez/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: tr
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "_posts/tr"
      type: posts
    values:
      layout: post
      lang: tr
      permalink: /yazilar/:title/
  - scope:
      path: "_posts/en"
      type: posts
    values:
      layout: post
      lang: en
      permalink: /en/posts/:title/

# Alt bilgideki iletişim bağlantıları
contact_links:
  - title: LinkedIn
    url: https://www.linkedin.com/in/cemustafasonmez/

plugins:
  - jekyll-sitemap

exclude:
  - README.md
