title: Mustafa Sönmez
url: "https://sonmezmustafa.com"
baseurl: ""
markdown: kramdown
timezone: Europe/Istanbul

# Kişi şemasındaki "sameAs": aynı kişiye ait diğer profiller
same_as:
  - https://github.com/sonmezmustafa

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: tr
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "_posts/tr"
      type: posts
    values:
      layout: post
      lang: tr
      permalink: /yazilar/:title/
  - scope:
      path: "_posts/en"
      type: posts
    values:
      layout: post
      lang: en
      permalink: /en/posts/:title/

plugins:
  - jekyll-sitemap

exclude:
  - README.md
