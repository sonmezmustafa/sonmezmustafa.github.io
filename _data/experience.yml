    roles_title: "Path"
    tools_title: "Tools"
    open: "Details"

center:
  tr:
    name: "Mustafa Sönmez"
    tag: "20 yıla yakın tecrübe"
    title: "Toplam tecrübe"
    text: "ODTÜ'de inşaat mühendisliği okurken aldığım programlama dersleri yönümü yazılıma çevirdi. O günden bu yana otuzdan fazla yazılımda analist, geliştirici, ekip lideri ve proje yöneticisi olarak çalıştım. Bu işlerin bir ucunda 25.000 I/O'luk bir kimya tesisinin kontrol odası, öbür ucunda büyük inşaat gruplarının hakediş, satın alma ve finans sistemleri var. Arada bir bakanlığın 800 sitesi, ülke ölçeğinde elektrik tüketimi tahmini ve yıllar süren bir makine öğrenmesi danışmanlığı duruyor. Bugün bu birikimi Codigno'da kendi ürünlerimize ve projelerimize çeviriyoruz."
    roles:
      - "İnşaat şirketinde yarı zamanlı mühendis yardımcısı"
      - "Analist"
      - "Full stack geliştirici"
      - "Yazılım ekip lideri ve ürün yöneticisi"
      - "Kurucu ortak ve proje yöneticisi"
    tools: "PHP, Go, C#, Python, Java, Fortran, Matlab · ABB 800xA DCS, Siemens PLC, Kepware OPC · MySQL, MSSQL, PostgreSQL, NoSQL · AutoCAD, SAP2000, LARSA, Primavera, MS Project"
  en:
    name: "Mustafa Sönmez"
    tag: "nearly 20 years"
    title: "Total experience"
    text: "The programming courses I took while studying civil engineering at METU turned me towards software. Since then I have worked on more than thirty software systems as an analyst, developer, team lead and project manager. At one end of this work is the control room of a 25,000 I/O chemical plant; at the other, the progress payment, purchasing and finance systems of major construction groups. In between sit a ministry's 800 websites, a nationwide electricity consumption forecast and a machine learning engagement that ran for years. Today we turn that experience into our own products and projects at Codigno."
    roles:
      - "Part-time assistant engineer at a construction company"
      - "Analyst"
      - "Full stack developer"
      - "Software team lead and product manager"
      - "Co-founder and project manager"
    tools: "PHP, Go, C#, Python, Java, Fortran, Matlab · ABB 800xA DCS, Siemens PLC, Kepware OPC · MySQL, MSSQL, PostgreSQL, NoSQL · AutoCAD, SAP2000, LARSA, Primavera, MS Project"

