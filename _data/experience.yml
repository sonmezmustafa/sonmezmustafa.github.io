ui:
  tr:
    intro: "Yirmi yıla yakın sürede yaptığım işlerin haritası. Kamuya ait kimya tesislerinden büyük inşaat gruplarına, bir bakanlığın yüzlerce sitesinden şarj istasyonlarına kadar. Bir düğüm seçin; çizgiler o işin hangi alanlara ve sektörlere dokunduğunu gösterir, işler ve alt modülleri hemen altında listelenir."
    reset: "Tümünü göster"
    related: "Bağlantılı"
    contains: "Bu koldakiler"
    codigno: "Codigno"
    roles_title: "Yol"
    tools_title: "Araçlar"
    open: "Ayrıntı"
  en:
    intro: "A map of the work I have done over nearly twenty years. From state-owned chemical plants to major construction groups, from a ministry's hundreds of websites to EV chargers. Pick a node; the lines show which fields and sectors that work touches, and the work and its modules are listed right below."
    reset: "Show all"
    related: "Connected"
    contains: "In this branch"
