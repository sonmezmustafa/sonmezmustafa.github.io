---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<article>
  <h1>{{ page.title }}</h1>
  {%- if page.translated_by %}
  <p class="meta">{{ t.translated_by }}, {{ page.translated_by }}</p>
  {%- endif %}
  {{ content }}
</article>
<p class="back"><a href="{{ t.posts_url | relative_url }}">← {{ t.all_posts }}</a></p>
