---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: t.date_format }}</time></p>
  {{ content }}
</article>
<p class="back"><a href="{{ t.posts_url | relative_url }}">← {{ t.all_posts }}</a></p>
