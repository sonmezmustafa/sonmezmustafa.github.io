---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: t.date_format }}</time></p>
  {{ content }}
</article>
<p class="back"><a href="{{ t.blog_url | relative_url }}">← {{ t.back_to_blog }}</a></p>
